<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Examination</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .exam-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
        }

        .exam-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: var(--shadow-lg), 0 0 40px -8px var(--glow-primary);
            border-color: var(--primary);
        }

        .exam-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 0.5rem;
            border-radius: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-active {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }

        .status-upcoming {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }
    </style>
</head>

<body>
    <img src="../assets/img/vignan_header.png" alt="Header"
        style="display: block; width: 100%; max-height: 120px; object-fit: contain; background: white;">
    <nav class="glass-panel"
        style="position: sticky; top: 1rem; z-index: 100; margin: 1rem auto; width: 95%; max-width: 1200px; padding: 0.75rem 2rem; display: flex; justify-content: space-between; align-items: center; border-radius: 99px; background: rgba(15, 14, 23, 0.6); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 30px rgba(0,0,0,0.3);">
        <div style="display: flex; align-items: center; gap: 1rem;">

            <div class="logo" style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">
                Examination <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">Student</span>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <div id="studentName" style="font-weight: 500;">Student Name</div>
            <a href="report_card.html" class="btn"
                style="padding: 0.5rem 1rem; font-size: 0.85rem; border: none; color: white; margin-right: 0.5rem; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); transition: opacity 0.2s;">
                📊 Report Card
            </a>
            <button onclick="Auth.logout()" class="btn btn-outline"
                style="padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--danger); border-color: transparent;">Logout</button>
        </div>
    </nav>

    <main class="container" style="padding-top: 2rem;">

        <!-- Welcome Section -->
        <section style="margin-bottom: 3rem;" class="fade-in">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Ready to excel?</h1>
            <p style="color: var(--text-muted);">View your upcoming exams and performance below.</p>
        </section>

        <!-- Stats Row -->
        <section
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem;"
            class="fade-in">
            <div class="glass-panel float-card" style="padding: 1.5rem;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem;">My Rank</h3>
                <div style="font-size: 2rem; font-weight: 700; color: var(--primary);" id="stat-rank">--</div>
                <div style="font-size: 0.8rem; color: var(--success);" id="stat-percentile">--</div>
            </div>
            <div class="glass-panel float-card" style="padding: 1.5rem;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem;">Exams Taken</h3>
                <div style="font-size: 2rem; font-weight: 700;" id="stat-exams-taken">0</div>
            </div>
            <div class="glass-panel float-card" style="padding: 1.5rem;">
                <h3 style="color: var(--text-muted); font-size: 0.9rem;">Avg. Score</h3>
                <div style="font-size: 2rem; font-weight: 700; color: var(--secondary);" id="stat-avg-score">--</div>
            </div>
        </section>

        <!-- Available Exams -->
        <section>
            <h2 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem;">
                Available Exams
                <span class="status-badge status-active">Live</span>
            </h2>

            <div id="examList"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
                <!-- Content Populated by JS -->
            </div>
        </section>

    </main>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        const session = Auth.checkSession();
        if (!session || (session.role !== 'student' && session.role !== 'admin')) {
            window.location.href = '../index.html';
        }
        if (session) {
            document.getElementById('studentName').innerText = session.name;
        }

        // Stats
        const results = ExamService.getStudentResults(session.id);
        const totalExams = results.length;
        const avgScore = totalExams > 0
            ? Math.round(results.reduce((acc, r) => acc + r.score, 0) / totalExams)
            : 0;

        // Mock Rank calculation - comparing to all results in DB
        const allResults = ExamService.getResults();
        let rank = '--';
        let percentile = '--';

        if (totalExams > 0 && allResults.length > 0) {
            // Simple global ranking based on average score of all students
            const studentScores = {}; // studentId -> avg
            allResults.forEach(r => {
                if (!studentScores[r.studentId]) studentScores[r.studentId] = [];
                studentScores[r.studentId].push(r.score);
            });

            const averages = Object.keys(studentScores).map(sid => {
                const scores = studentScores[sid];
                return {
                    sid,
                    avg: scores.reduce((a, b) => a + b, 0) / scores.length
                };
            });

            averages.sort((a, b) => b.avg - a.avg);
            const myRankIndex = averages.findIndex(a => a.sid === session.id);
            if (myRankIndex > -1) {
                rank = `#${myRankIndex + 1}`;
                const p = ((averages.length - myRankIndex) / averages.length) * 100;
                percentile = `Top ${Math.round(100 - p + 1)}%`; // Rough approx
            }
        }

        document.getElementById('stat-rank').innerHTML = rank;
        document.getElementById('stat-percentile').innerText = percentile;
        document.getElementById('stat-exams-taken').innerText = totalExams;
        document.getElementById('stat-avg-score').innerText = avgScore + '%';


        // Fetch Exams
        const exams = ExamService.getExams();
        const container = document.getElementById('examList');

        if (exams.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No exams available at the moment.</p>';
        } else {
            // 1. Filter by Year (Strict but loose type for safety)
            const filteredExams = (session.role === 'admin')
                ? exams
                // Filter by Batch and Branch (Case Insensitive)
                : exams.filter(e => {
                    // 1. Batch Match (Strict)
                    const studentBatch = String(session.batch || '').trim();
                    let batchMatch = false;

                    if (Array.isArray(e.batch)) {
                        batchMatch = e.batch.includes(studentBatch);
                    } else {
                        // Handle legacy single value or comma-separated
                        const examBatches = String(e.batch || '').split(',').map(b => b.trim());
                        batchMatch = examBatches.includes(studentBatch);
                    }

                    // 2. Branch Match (Strict, handles 'All')
                    const studentBranch = String(session.branch || '').toUpperCase();
                    let branchMatch = false;

                    if (Array.isArray(e.branch)) {
                         const upperBranches = e.branch.map(b => String(b).toUpperCase());
                         branchMatch = upperBranches.includes('ALL') || upperBranches.includes(studentBranch);
                    } else {
                        const examBranch = String(e.branch || '').toUpperCase();
                        branchMatch = examBranch === 'ALL' || examBranch === studentBranch;
                    }

                    return batchMatch && branchMatch;
                });

            container.innerHTML = filteredExams.length === 0
                ? '<p style="color:var(--text-muted); grid-column: 1/-1;">No exams available for your Batch & Branch at the moment.</p>'
                : filteredExams.map(exam => {
                    // Check if taken
                    const isTaken = results.some(r => r.examId === exam.id);
                    // Status check
                    const isDraft = exam.status !== 'published';

                    // Attempt Checks
                    const attempts = results.filter(r => r.examId === exam.id);
                    const attemptCount = attempts.length;
                    const limit = exam.attemptLimit || 1; // Default to 1
                    const canAttempt = limit === -1 || attemptCount < limit;

                    let statusBadge;
                    if (isDraft) {
                        statusBadge = `<span class="status-badge" style="background:var(--surface); border:1px solid var(--border); color:var(--text-muted);">Coming Soon</span>`;
                    } else if (attemptCount > 0) {
                        statusBadge = `<span class="status-badge" style="background:${canAttempt ? 'rgba(108,99,255,0.15)' : 'rgba(52,211,153,0.15)'}; color:${canAttempt ? '#818cf8' : '#34d399'};">Attempts: ${attemptCount}${limit === -1 ? '' : '/' + limit}</span>`;
                    } else {
                        statusBadge = `<span class="status-badge status-active">Active</span>`;
                    }

                    // Button Logic
                    let actionBtn;
                    const isAdmin = session.role === 'admin';

                    if (isAdmin) {
                        actionBtn = `<button class="btn btn-outline" disabled style="margin-top: auto; width: 100%; cursor: not-allowed; opacity: 0.7;">Admin View Only</button>`;
                    } else if (isDraft) {
                        actionBtn = `<button class="btn btn-outline" disabled style="margin-top: auto; width: 100%; opacity: 0.5; cursor: not-allowed;">Not Published</button>`;
                    } else if (!canAttempt) {
                        // Limit Reached - Show Report
                        const bestScore = Math.max(...attempts.map(a => a.score));
                        actionBtn = `
                            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; width: 100%;">
                                <div style="text-align: center; font-size: 0.85rem; color: var(--success); font-weight: 500;">Best Score: ${bestScore}%</div>
                                <a href="report.html?id=${exam.id}" class="btn" style="width: 100%; justify-content: center; background: linear-gradient(135deg, #10b981, #3b82f6); color: white; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">📄 View Report</a>
                            </div>
                        `;
                    } else {
                        // Can Attempt (First time or Retake)
                        const isSurvey = exam.examType === 'survey' || exam.isSurvey;
                        const actionLabel = isSurvey 
                            ? (attemptCount > 0 ? 'Retake Survey' : 'Start Survey')
                            : (attemptCount > 0 ? 'Retake Exam' : 'Start Exam');
                        actionBtn = `
                            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 0.5rem; width: 100%;">
                                <a href="../exam/index.html?id=${exam.id}" class="btn btn-primary" style="text-align: center; width: 100%; justify-content: center; ${isSurvey ? 'background: linear-gradient(135deg, #7c3aed, #a855f7); border: none;' : ''}">${actionLabel}</a>
                                ${attemptCount > 0 ? `<a href="report.html?id=${exam.id}" class="btn" style="width: 100%; justify-content: center; font-size: 0.85rem; background: linear-gradient(135deg, #10b981, #3b82f6); color: white; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">📄 View Report</a>` : ''}
                            </div>
                        `;
                    }

                    const isSurvey = exam.examType === 'survey' || exam.isSurvey;

                    return `
                <div class="exam-card fade-in" style="${isTaken ? 'opacity: 0.85; border-color: var(--success);' : ''}">
                    <div>
                        <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom: 0.5rem;">
                            ${statusBadge}
                            ${isSurvey ? '<span class="status-badge" style="background:rgba(168,85,247,0.18); color:#c084fc; border:1px solid rgba(168,85,247,0.35);">Survey</span>' : ''}
                            ${isTaken ? '<span class="status-badge" style="background:var(--success); color:white;">Completed</span>' : ''}
                        </div>
                        <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem; margin-top: 0.25rem;">${exam.title}</h3>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
                            ${exam.subject}
                        </p>
                    </div>
                    
                    <div class="exam-meta">
                        <span>⏱ ${exam.duration} Mins</span>
                        <span>📝 ${exam.questions ? exam.questions.length : 0} Questions</span>
                    </div>

                    ${actionBtn}
                </div>
            `;
                }).join('');
        }
    </script>
</body>

</html>
